name: Native Integration Tests

# Behavioral end-to-end suite running WITHOUT Docker: native Postgres + native
# rubixgoplatform processes (see test/integration/env/native_env.py). This is the
# cross-OS counterpart to docker-integration.yml (Linux/Docker only) — it proves
# the same suite passes on macOS and Windows, where GitHub-hosted runners can't
# run the Linux node containers.
#
# Each OS: install Postgres, build the node binary natively (CGO), then run the
# --native runner against config.native.json (node_index-derived ports).

on:
  pull_request:
    branches:
      - release-v1
  workflow_dispatch:

concurrency:
  group: native-integration-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  native:
    name: Native suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false   # let macOS finish even if Windows breaks, and vice-versa
      matrix:
        include:
          - os: ubuntu-latest
            bin_path: linux/rubixgoplatform
          - os: macos-latest
            bin_path: mac/rubixgoplatform
          - os: windows-latest
            bin_path: windows/rubixgoplatform.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r test/integration/requirements.txt

      # ---- Postgres provisioning (per-OS) -------------------------------- #
      # The harness manages its own 3 instances; we only need initdb/pg_ctl on
      # PATH. Ubuntu and the Windows runner ship Postgres; macOS gets it via brew.
      - name: Install/locate Postgres (Linux)
        if: runner.os == 'Linux'
        run: |
          # postgresql client+server are preinstalled on ubuntu-latest under
          # /usr/lib/postgresql/<ver>/bin — add it to PATH for initdb/pg_ctl.
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          echo "$PGBIN" >> "$GITHUB_PATH"

      - name: Install Postgres (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16 || true
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"

      - name: Locate Postgres (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest ships PostgreSQL under $env:PGBIN; fall back to the
          # standard install dir. Append to PATH so initdb/pg_ctl resolve.
          $pgbin = $env:PGBIN
          if (-not $pgbin) {
            $pgbin = (Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin' | Sort-Object Name -Descending | Select-Object -First 1).FullName
          }
          Write-Host "Postgres bin: $pgbin"
          Add-Content -Path $env:GITHUB_PATH -Value $pgbin

      # ---- Build the node binary natively (CGO, no cross-compile) --------- #
      # macOS needs -linkmode=external. The darwin build imports system dylibs
      # (via net, os/user, crypto/x509), and Go 1.22's *internal* linker emits no
      # LC_UUID load command — which macOS 15+/26 dyld hard-rejects, aborting the
      # binary at launch with SIGABRT (exit 134) before main() ever runs.
      # CGO_ENABLED=1 does not switch linkers by itself: the repo has no cgo code
      # of its own, so the toolchain still links internally. Forcing the external
      # linker routes the link through the system `ld`, which writes LC_UUID.
      # Linux is unaffected and stays on the default linker.
      - name: Build rubixgoplatform (Unix)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: '1'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            go build -ldflags='-linkmode=external' -o ${{ matrix.bin_path }}
          else
            go build -o ${{ matrix.bin_path }}
          fi

      # Prove the binary actually runs on this runner before the suite spends
      # minutes provisioning Postgres and IPFS. A SIGABRT here (rather than
      # inside the harness) is far cheaper to diagnose: the arch/linkage dump
      # below plus the binary's own stderr pinpoint it immediately.
      - name: Verify binary is runnable (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "=== go env ==="
          go env GOOS GOARCH CGO_ENABLED
          echo "=== uname ==="
          uname -m
          echo "=== file ==="
          file ${{ matrix.bin_path }}
          echo "=== dynamic libraries ==="
          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L ${{ matrix.bin_path }} || true
          else
            ldd ${{ matrix.bin_path }} || true
          fi
          echo "=== smoke test: init into a temp dir ==="
          SMOKE_DIR="$(mktemp -d)"
          set +e
          ./${{ matrix.bin_path }} init -p "$SMOKE_DIR"
          RC=$?
          set -e
          echo "init exit code: $RC"
          if [ $RC -ne 0 ]; then
            echo "::error::Node binary failed to run on ${{ matrix.os }} (exit $RC). See the arch/linkage dump above."
            exit $RC
          fi
          ls -la "$SMOKE_DIR"

      - name: Build rubixgoplatform (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: go build -o ${{ matrix.bin_path }}

      # ---- Run the native suite ------------------------------------------ #
      - name: Run native integration suite (all subsystems + negatives)
        run: >
          python -m test.integration.runner
          --native
          --config test/integration/config.native.json
          --small-test --run-all-tests

      # A process killed by a signal (e.g. SIGABRT from a dyld load failure) may
      # write nothing to its own stderr — macOS routes the reason to the crash
      # reporter instead. These reports name the termination reason and the
      # faulting library outright, so they close the gap when the harness logs
      # show only "died with SIGABRT" and an empty stderr.
      - name: Dump macOS crash reports on failure
        if: failure() && runner.os == 'macOS'
        run: |
          echo "=== DiagnosticReports directory ==="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || echo "(no user DiagnosticReports dir)"
          ls -la /Library/Logs/DiagnosticReports/ 2>/dev/null || echo "(no system DiagnosticReports dir)"

          echo "=== rubixgoplatform crash reports ==="
          # .ips is the modern format; .crash is the legacy one. Copy them into
          # the artifact path so they survive the runner being torn down.
          #
          # `find` rather than a shell glob: an unmatched glob is passed through
          # literally by bash and is a hard error in zsh, so globbing here would
          # be shell-dependent. find just prints nothing when there is no match.
          mkdir -p test/native/data/crashreports
          found=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            found=1
            echo "----- $f -----"
            cat "$f" || true
            cp "$f" test/native/data/crashreports/ 2>/dev/null || true
          done <<EOF
          $(find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports \
              -maxdepth 1 \( -name 'rubixgoplatform*.ips' -o -name 'rubixgoplatform*.crash' \) \
              2>/dev/null)
          EOF

          if [ "$found" -eq 0 ]; then
            echo "(no rubixgoplatform crash reports found)"
            echo "=== most recent crash reports of any process, for context ==="
            find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports \
              -maxdepth 1 -name '*.ips' 2>/dev/null | head -10 || true
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-logs-${{ matrix.os }}
          path: |
            test/docker/data/stress/logs/**
            test/native/data/**/*.log
            test/native/data/**/pgdata/server.log
            test/native/data/crashreports/**
          if-no-files-found: warn
