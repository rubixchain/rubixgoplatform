      test: ["CMD-SHELL", "pg_isready -U rubix -d rubix_q"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5438:5432"

  quorum:
    build:
      context: ../..
      dockerfile: test/docker/rubix/Dockerfile
    image: rubix-node:latest
    container_name: rubix-stress-quorum
    depends_on:
      quorum-postgres:
        condition: service_healthy
    environment:
      NETWORK_MODE: localnet
      DB_HOST: quorum-postgres
      DB_PORT: 5432
