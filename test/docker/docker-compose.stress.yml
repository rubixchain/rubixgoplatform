networks:
  rubix-stress-net:
    driver: bridge

services:

  # ─── nodeA ────────────────────────────────────────────────────────────────

  nodeA-postgres:
    image: postgres:16
    container_name: rubix-stress-nodeA-postgres
    environment:
      POSTGRES_USER: rubix
      POSTGRES_PASSWORD: rubixpass
      POSTGRES_DB: rubix_a
    volumes:
      - ./data/stress/nodeA/db:/var/lib/postgresql/data
    networks:
      - rubix-stress-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubix -d rubix_a"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5436:5432"

  nodeA:
    build:
      context: ../..
      dockerfile: test/docker/rubix/Dockerfile
    image: rubix-node:latest
    container_name: rubix-stress-nodeA
    depends_on:
      nodeA-postgres:
        condition: service_healthy
    environment:
      NETWORK_MODE: localnet
      DB_HOST: nodeA-postgres
      DB_PORT: 5432
      DB_NAME: rubix_a
    ports:
      - "20010:20000"
    volumes:
      - ./data/stress/nodeA/app:/app/data
      - ./swarm:/swarm
    networks:
      - rubix-stress-net
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/20000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ─── nodeB ────────────────────────────────────────────────────────────────

  nodeB-postgres:
    image: postgres:16
    container_name: rubix-stress-nodeB-postgres
