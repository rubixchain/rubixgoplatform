version: 2

project_name: rubixgoplatform

env:
  - CGO_ENABLED=1

before:
  hooks:
    - go mod tidy -compat=1.20

builds:

  - id: ubuntu-amd64
    main: ./
    binary: rubixgoplatform
    env:
      - CC=x86_64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - amd64
    ldflags: &ldflags
      - -s -w
      - -X github.com/rubixchain/rubixgoplatform/command.version={{ .Version }}
      - -X github.com/rubixchain/rubixgoplatform/command.currentCommit={{ .FullCommit }}

  - id: ubuntu-arm64
    main: ./
    binary: rubixgoplatform
    env:
      - CC=aarch64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - arm64
    ldflags: *ldflags

  # Both darwin builds add -linkmode=external on top of the shared ldflags.
  # The darwin binary imports system dylibs (via net, os/user, crypto/x509), and
  # the Go 1.22 internal linker used by the goreleaser-cross image emits no
  # LC_UUID load command. macOS 15+/26 dyld rejects such a binary outright:
  #   dyld: missing LC_UUID load command → SIGABRT (exit 134)
  # CGO_ENABLED alone won't switch linkers — this repo has no cgo code of its
  # own, so the link stays internal unless linkmode is forced. Without this, the
  # released macOS binaries do not start at all on current macOS.
  - id: darwin-amd64
    main: ./
    binary: rubixgoplatform
    env:
      - CC=o64-clang
      - CGO_LDFLAGS=-L/lib
    goos:
      - darwin
    goarch:
      - amd64
    ldflags: &darwin_ldflags
      - -s -w
      - -X github.com/rubixchain/rubixgoplatform/command.version={{ .Version }}
      - -X github.com/rubixchain/rubixgoplatform/command.currentCommit={{ .FullCommit }}
      - -linkmode=external

  - id: darwin-arm64
    main: ./
    binary: rubixgoplatform
    env:
      - CC=oa64-clang
      - CGO_LDFLAGS=-L/lib
    goos:
      - darwin
    goarch:
      - arm64
    ldflags: *darwin_ldflags

  - id: windows-amd64
    main: ./
    binary: rubixgoplatform
    env:
      - CC=x86_64-w64-mingw32-gcc
    goos:
      - windows
    goarch:
      - amd64
    ldflags: *ldflags

archives:
  - id: linux-darwin-archive
    builds:
      - ubuntu-amd64
      - ubuntu-arm64
      - darwin-amd64
      - darwin-arm64
    format: tar.gz
    wrap_in_directory: false
    name_template: "{{ .Binary }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"

  - id: windows-archive
    builds:
      - windows-amd64
    format: zip
    wrap_in_directory: false
    name_template: "{{ .Binary }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: rubixchain
    name: rubixgoplatform

  draft: false
  mode: append
  header: |
    # Release Notes