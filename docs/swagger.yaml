definitions:
  model.ArbitrarySignRequest:
    properties:
      msg_to_sign:
        type: string
      signer_did:
        type: string
    type: object
  model.BasicResponse:
    properties:
      message:
        type: string
      result: {}
      status:
        type: boolean
    type: object
  model.GetTokenChainResponce:
    properties:
      message:
        type: string
      result: {}
      status:
        type: boolean
      tokenChainData:
        items: {}
        type: array
    type: object
  model.NFTInfo:
    properties:
      nft:
        type: string
      nft_file_name:
        type: string
      nft_metadata:
        type: string
      nft_value:
        type: number
      owner_did:
        type: string
    type: object
  model.NFTList:
    properties:
      message:
        type: string
      nfts:
        items:
          $ref: '#/definitions/model.NFTInfo'
        type: array
      result: {}
      status:
        type: boolean
    type: object
  models.FTInfo:
    properties:
      creatorDID:
        type: string
      ftName:
        type: string
      numberOfFts:
        type: number
    type: object
  models.NFTInfo:
    properties:
      data:
        type: string
      nftId:
        type: string
      value:
        type: number
    type: object
  models.SmartContractInfo:
    properties:
      data:
        type: string
      smartContractId:
        type: string
      value:
        type: number
    type: object
  models.TransactionRequest:
    properties:
      initiator:
        type: string
      memo:
        type: string
      owner:
        type: string
      tokens:
        $ref: '#/definitions/models.TransactionTokenDetails'
    type: object
  models.TransactionTokenDetails:
    properties:
      ft:
        items:
          $ref: '#/definitions/models.FTInfo'
        type: array
      nft:
        items:
          $ref: '#/definitions/models.NFTInfo'
        type: array
      rbt:
        type: number
      smartContract:
        items:
          $ref: '#/definitions/models.SmartContractInfo'
        type: array
      transferNftOwnership:
        type: boolean
    type: object
  server.CreateFTReqSwaggoInput:
    properties:
      did:
        type: string
      ft_count:
        type: integer
      ft_name:
        type: string
      ft_num_start_index:
        type: integer
      token_count:
        type: integer
    type: object
  server.DIDPeerMapTemp:
    properties:
      did:
        type: string
      peerID:
        type: string
    type: object
  server.DeployNFTSwaggoInput:
    properties:
      did:
        type: string
      nft:
        type: string
      nft_data:
        type: string
      nft_file_name:
        type: string
      nft_metadata:
        type: string
      nft_value:
        type: number
      quorum_type:
        type: integer
    type: object
  server.DeploySmartContractSwaggoInput:
    properties:
      comment:
        type: string
      deployerAddr:
        type: string
      quorumType:
        type: integer
      rbtAmount:
        type: number
      smartContractToken:
        type: string
    type: object
  server.ExecuteNFTSwaggoInput:
    properties:
      comment:
        type: string
      executor:
        type: string
      nft:
        type: string
      nft_data:
        type: string
      nft_value:
        type: number
      quorum_type:
        type: integer
      receiver:
        type: string
    type: object
  server.ExecuteSmartContractSwaggoInput:
    properties:
      comment:
        type: string
      executorAddr:
        type: string
      quorumType:
        type: integer
      smartContractData:
        type: string
      smartContractToken:
        type: string
    type: object
  server.FailedFTDownloadStatusRequest:
    properties:
      did:
        type: string
    type: object
  server.GetSmartContractTokenChainDataSwaggoInput:
    properties:
      latest:
        type: boolean
      token:
        type: string
    type: object
  server.NewNFTSwaggoInput:
    properties:
      nft:
        type: string
    type: object
  server.NewSubscriptionSwaggoInput:
    properties:
      smartContractToken:
        type: string
    type: object
  server.RegisterCallBackURLSwaggoInput:
    properties:
      CallBackURL:
        type: string
      SmartContractToken:
        type: string
    type: object
  server.RetryFailedFTDownloadsRequest:
    properties:
      did:
        type: string
    type: object
  types.DIDCreate:
    properties:
      childPath:
        type: integer
      mnemonic:
        type: string
      password:
        type: string
      private_key:
        type: string
      public_key:
        type: string
    type: object
  types.SignRespData:
    properties:
      id:
        type: string
      password:
        type: string
      signature:
        description: signature string should be base64
        type: string
    type: object
info:
  contact: {}
  description: Rubix core API to control & manage the node.
  title: Rubix Core
  version: "1.0"
paths:
  /api/add-peer-details:
    post:
      consumes:
      - application/json
      description: This API allows the user to add peer details manually
      parameters:
      - description: Peer Details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.DIDPeerMapTemp'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Add Peer
      tags:
      - Account
  /api/deploy-nft:
    post:
      consumes:
      - application/json
      description: This API will deploy the NFT
      operationId: deploy-nft
      parameters:
      - description: Deploy nft
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.DeployNFTSwaggoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Deploy NFT
      tags:
      - NFT
  /api/deploy-smart-contract:
    post:
      consumes:
      - application/json
      description: This API will deploy smart contract Token
      operationId: deploy-smart-contract
      parameters:
      - description: Deploy smart contract
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.DeploySmartContractSwaggoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Deploy Smart Contract
      tags:
      - Smart Contract
  /api/execute-nft:
    post:
      consumes:
      - application/json
      description: This API will add a new block which indicates either transfer of
        ownership of NFT or internal state change through self-execution
      parameters:
      - description: 'Transfer the ownership of particular NFT or self-execution with
          some data if ''receiver'' is empty '
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.ExecuteNFTSwaggoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Execution of NFT
      tags:
      - NFT
  /api/execute-smart-contract:
    post:
      consumes:
      - application/json
      description: This API will Execute smart contract Token
      parameters:
      - description: Execute smart contrct and add details to chain
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.ExecuteSmartContractSwaggoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Execute Smart Contract
      tags:
      - Smart Contract
  /api/fetch-nft:
    get:
      consumes:
      - application/json
      description: This API will Fetch NFT
      operationId: fetch-nft
      parameters:
      - in: query
        name: nft
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Fetch NFT
      tags:
      - NFT
  /api/fetch-smart-contract:
    get:
      consumes:
      - application/json
      description: This API will Fetch smart contract
      operationId: fetch-smart-contract
      parameters:
      - in: query
        name: smartContractToken
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Fetch Smart Contract
      tags:
      - Smart Contract
  /api/get-failed-ft-download-status:
    post:
      consumes:
      - application/json
      description: This API returns the status of failed FT downloads
      operationId: get-failed-ft-download-status
      parameters:
      - description: DID
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.FailedFTDownloadStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Get Failed FT Download Status
      tags:
      - FT
  /api/get-ft-token-chain:
    get:
      consumes:
      - application/json
      description: This API returns FT token chain data for a given FT token ID.
      parameters:
      - description: FT Token ID
        in: query
        name: tokenID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with token chain data
          schema:
            $ref: '#/definitions/model.GetTokenChainResponce'
      summary: Get FT Token Chain Data
      tags:
      - FT
  /api/get-nft-token-chain-data:
    get:
      consumes:
      - application/json
      description: This API will return nft token chain data
      operationId: get-nft-token-chain-data
      parameters:
      - description: NFT token id
        in: query
        name: nft
        required: true
        type: string
      - description: Set to true if you only need the latest token block
        in: query
        name: latest
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Get NFT Token Chain Data
      tags:
      - NFT
  /api/get-smart-contract-token-chain-data:
    post:
      consumes:
      - application/json
      description: This API will return smart contract token chain data
      operationId: get-smart-contract-token-chain-data
      parameters:
      - description: Returns Smart contract token chain Execution Data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.GetSmartContractTokenChainDataSwaggoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Get Smart Contract Token Chain Data
      tags:
      - Smart Contract
  /api/list-nfts:
    get:
      consumes:
      - application/json
      description: This API will get all NFTs deployed on the node
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.NFTList'
      summary: Get ALL NFTs
      tags:
      - NFT
  /api/recover-lost-tokens:
    post:
      consumes:
      - application/json
      description: Allows senders to recover tokens that were sent but not received
        by the receiver
      operationId: recover-lost-tokens
      parameters:
      - description: DID of the sender
        in: body
        name: sender_did
        required: true
        schema:
          type: string
      - description: Transaction ID to recover tokens from
        in: body
        name: transaction_id
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Recover lost tokens
      tags:
      - FT
  /api/register-callback-url:
    post:
      consumes:
      - application/json
      description: This API will register call back url for when updated come for
        smart contract token
      operationId: register-callback-url
      parameters:
      - description: Register call back URL
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.RegisterCallBackURLSwaggoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Get Smart Contract Token Chain Data
      tags:
      - Smart Contract
  /api/remote-recover-tokens:
    post:
      consumes:
      - application/json
      description: Allows Node A to trigger token recovery on Node B
      operationId: remote-recover-tokens
      parameters:
      - description: DID of the target node where recovery should happen
        in: body
        name: target_did
        required: true
        schema:
          type: string
      - description: Transaction ID to recover
        in: body
        name: transaction_id
        required: true
        schema:
          type: string
      - description: DID of the requesting node
        in: body
        name: requester_did
        required: true
        schema:
          type: string
      - description: Reason for remote recovery
        in: body
        name: reason
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Initiate remote token recovery
      tags:
      - FT
  /api/retry-failed-ft-downloads:
    post:
      consumes:
      - application/json
      description: This API retries downloading failed FT tokens
      operationId: retry-failed-ft-downloads
      parameters:
      - description: DID
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.RetryFailedFTDownloadsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Retry Failed FT Downloads
      tags:
      - FT
  /api/subscribe-nft:
    post:
      consumes:
      - application/json
      description: This API endpoint allows subscribing to a NFT.
      parameters:
      - description: Subscribe to input nft
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.NewNFTSwaggoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Subscribe to NFT
      tags:
      - NFT
  /api/subscribe-smart-contract:
    post:
      consumes:
      - application/json
      description: This API endpoint allows subscribing to a smart contract.
      parameters:
      - description: Subscribe to input contract
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.NewSubscriptionSwaggoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Subscribe to Smart Contract
      tags:
      - Smart Contract
  /rubix/v1/dids:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all DIDs.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Get All DIDs
      tags:
      - DID
  /rubix/v1/dids/{did}/balances:
    get:
      consumes:
      - application/json
      description: Retrieves the overall balance (RBT, FT, NFT) for a given DID.
      parameters:
      - description: DID (e.g. did:bafybmih3l2emb4s7wbsgakwv4voaqngdirpg5f3kqlheqqsgdg7jthuwaq)
        in: path
        name: did
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Get DID Balance
      tags:
      - DID
  /rubix/v1/dids/{did}/balances/ft:
    get:
      consumes:
      - application/json
      description: Retrieves the Fungible Token (FT) balance for a given DID.
      parameters:
      - description: DID (e.g. did:bafybmih3l2emb4s7wbsgakwv4voaqngdirpg5f3kqlheqqsgdg7jthuwaq)
        in: path
        name: did
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Get FT Balance
      tags:
      - DID
  /rubix/v1/dids/{did}/balances/nft:
    get:
      consumes:
      - application/json
      description: Retrieves the Non-Fungible Token (NFT) balance for a given DID.
      parameters:
      - description: DID (e.g. did:bafybmih3l2emb4s7wbsgakwv4voaqngdirpg5f3kqlheqqsgdg7jthuwaq)
        in: path
        name: did
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Get NFT Balance
      tags:
      - DID
  /rubix/v1/dids/{did}/balances/rbt:
    get:
      consumes:
      - application/json
      description: Retrieves the RBT token balance for a given DID.
      parameters:
      - description: DID (e.g. did:bafybmih3l2emb4s7wbsgakwv4voaqngdirpg5f3kqlheqqsgdg7jthuwaq)
        in: path
        name: did
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Get RBT Balance
      tags:
      - DID
  /rubix/v1/dids/{did}/register:
    post:
      consumes:
      - application/json
      description: Registers a DID on the network.
      parameters:
      - description: DID to register (e.g. did:bafybmih2cqn6okxy2sepgp75jq5dkopuohnbd3pfrrylmqnrz43ttihkky)
        in: path
        name: did
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Register DID
      tags:
      - DID
  /rubix/v1/dids/create:
    post:
      consumes:
      - application/json
      description: Creates a new DID with the provided public key, password, and mnemonic.
      parameters:
      - description: Create DID Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.DIDCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Create DID
      tags:
      - DID
  /rubix/v1/fts:
    get:
      consumes:
      - application/json
      description: This API endpoint will list FTs.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: List FTs
      tags:
      - FT
  /rubix/v1/fts/mint:
    post:
      consumes:
      - application/json
      description: This API endpoint will create FTs.
      parameters:
      - description: Create FT
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.CreateFTReqSwaggoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Create FT
      tags:
      - FT
  /rubix/v1/nfts/generate:
    post:
      consumes:
      - multipart/form-data
      description: This API will create new NFT
      parameters:
      - description: DID
        in: formData
        name: did
        required: true
        type: string
      - description: JSON file which contains information about the NFT
        in: formData
        name: metadata
        required: true
        type: file
      - description: File which is meant to be an NFT
        in: formData
        name: artifact
        required: true
        type: file
      produces:
      - multipart/form-data
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Create NFT
      tags:
      - NFT
  /rubix/v1/signature:
    post:
      consumes:
      - application/json
      description: This API is used to supply the password for the node along with
        the ID generated when Initiate RBT transfer is called.
      operationId: signature-response
      parameters:
      - description: Send input for requested signature
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/types.SignRespData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Signature Response
      tags:
      - Signature
  /rubix/v1/signature/arbitrary:
    post:
      consumes:
      - application/json
      description: Accepts a DID and message to request an arbitrary signature asynchronously.
      operationId: arbitrary-signature
      parameters:
      - description: Arbitrary Signature Request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.ArbitrarySignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Request Arbitrary Signature
      tags:
      - Signature
  /rubix/v1/signature/verify:
    get:
      consumes:
      - application/json
      description: Verifies a signature for a given DID and signed message.
      operationId: verify-arbitrary-signature
      parameters:
      - description: DID of the signer
        in: query
        name: signer_did
        required: true
        type: string
      - description: Signed message
        in: query
        name: signed_msg
        required: true
        type: string
      - description: Signature to verify
        in: query
        name: signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BasicResponse'
      summary: Verify Arbitrary Signature
      tags:
      - Signature
  /rubix/v1/smart_contracts/generate:
    post:
      consumes:
      - multipart/form-data
      description: This API will Generate smart contract Token
      parameters:
      - description: DID
        in: formData
        name: did
        required: true
        type: string
      - description: location of binary code hash
        in: formData
        name: binaryCodePath
        required: true
        type: file
      - description: location of raw code hash
        in: formData
        name: rawCodePath
        required: true
        type: file
      produces:
      - multipart/form-data
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BasicResponse'
