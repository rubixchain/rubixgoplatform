definitions:
  models.AddQuorumRequest:
    properties:
      did:
        type: string
    type: object
  models.ArbitrarySignRequest:
    properties:
      msg_to_sign:
        type: string
      signer_did:
        type: string
    type: object
  models.BasicResponse:
    properties:
      message:
        type: string
      result: {}
      status:
        type: boolean
    type: object
  models.FTInfo:
    properties:
      creatorDID:
        type: string
      ftName:
        type: string
      numberOfFts:
        type: number
    type: object
  models.GenerateLocalRBTRequest:
    properties:
      did:
        type: string
      number_of_tokens:
        type: integer
      start_index:
        type: integer
    type: object
  models.NFTInfo:
    properties:
      data:
        type: string
      nftId:
        type: string
      parentNFTId:
        description: |-
          ParentNFTId, when non-empty, signals a child-mint instruction: this entry
          mints a brand-new child NFT linked to the named parent. The parent is
          executed in the same transaction. NFTId is ignored when ParentNFTId is set —
          the server derives the child NFT ID via IPFS-add of parentNFTId+uuid.
        type: string
      value:
        type: number
    type: object
  models.QuorumSetup:
    properties:
      did:
        type: string
      password:
        type: string
      priv_password:
        type: string
    type: object
  models.RegisterCallBackUrlReq:
    properties:
      callBackURL:
        type: string
      smartContractToken:
        type: string
    type: object
  models.SmartContractInfo:
    properties:
      data:
        type: string
      smartContractId:
        type: string
      value:
        type: number
    type: object
  models.TransactionRequest:
    properties:
      initiator:
        type: string
      memo:
        type: string
      owner:
        type: string
      tokens:
        $ref: '#/definitions/models.TransactionTokenDetails'
    type: object
  models.TransactionTokenDetails:
    properties:
      ft:
        items:
          $ref: '#/definitions/models.FTInfo'
        type: array
      nft:
        items:
          $ref: '#/definitions/models.NFTInfo'
        type: array
      rbt:
        type: number
      smartContract:
        items:
          $ref: '#/definitions/models.SmartContractInfo'
        type: array
      transferNftOwnership:
        type: boolean
    type: object
  server.DIDPeerMapTemp:
    properties:
      did:
        type: string
      peerID:
        type: string
    type: object
  server.syncTransactionChainRequest:
    properties:
      did:
        type: string
      exclude_transaction_ids:
        items:
          type: string
        type: array
      token_ids:
        items:
          type: string
        type: array
    type: object
  types.CreateFTReq:
    properties:
      did:
        type: string
      ft_count:
        type: integer
      ft_name:
        type: string
      ft_num_start_index:
        type: integer
      token_count:
        type: integer
    type: object
  types.DIDCreate:
    properties:
      childPath:
        type: integer
      mnemonic:
        type: string
      password:
        type: string
      private_key:
        type: string
      public_key:
        type: string
    type: object
  types.SignRespData:
    properties:
      id:
        type: string
      password:
        type: string
      signature:
        description: signature string should be base64
        type: string
    type: object
info:
  contact: {}
  description: Rubix core API to control & manage the node.
  title: Rubix Core
  version: "1.0"
paths:
  /rubix/v1/dids:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all DIDs.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get All DIDs
      tags:
      - DID
  /rubix/v1/dids/{did}/balances:
    get:
      consumes:
      - application/json
      description: Retrieves the overall balance (RBT, FT, NFT) for a given DID.
      parameters:
      - description: DID (e.g. did:bafybmih3l2emb4s7wbsgakwv4voaqngdirpg5f3kqlheqqsgdg7jthuwaq)
        in: path
        name: did
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get DID Balance
      tags:
      - DID
  /rubix/v1/dids/{did}/balances/ft:
    get:
      consumes:
      - application/json
      description: Retrieves the Fungible Token (FT) balance for a given DID.
      parameters:
      - description: DID (e.g. did:bafybmih3l2emb4s7wbsgakwv4voaqngdirpg5f3kqlheqqsgdg7jthuwaq)
        in: path
        name: did
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get FT Balance
      tags:
      - DID
  /rubix/v1/dids/{did}/balances/nft:
    get:
      consumes:
      - application/json
      description: This API will get all NFTs owned by the particular did
      parameters:
      - description: DID (e.g. did:bafybmih3l2emb4s7wbsgakwv4voaqngdirpg5f3kqlheqqsgdg7jthuwaq)
        in: path
        name: did
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get NFTs owned by the particular did
      tags:
      - NFT
  /rubix/v1/dids/{did}/balances/rbt:
    get:
      consumes:
      - application/json
      description: Retrieves the RBT token balance for a given DID.
      parameters:
      - description: DID (e.g. did:bafybmih3l2emb4s7wbsgakwv4voaqngdirpg5f3kqlheqqsgdg7jthuwaq)
        in: path
        name: did
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get RBT Balance
      tags:
      - DID
  /rubix/v1/dids/{did}/register:
    post:
      consumes:
      - application/json
      description: Registers a DID on the network.
      parameters:
      - description: DID to register (e.g. did:bafybmih2cqn6okxy2sepgp75jq5dkopuohnbd3pfrrylmqnrz43ttihkky)
        in: path
        name: did
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Register DID
      tags:
      - DID
  /rubix/v1/dids/create:
    post:
      consumes:
      - application/json
      description: Creates a new DID with the provided public key, password, and mnemonic.
      parameters:
      - description: Create DID Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.DIDCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Create DID
      tags:
      - DID
  /rubix/v1/fts:
    get:
      consumes:
      - application/json
      description: Returns all fungible tokens (FTs) held on this node.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: List FTs
      tags:
      - FT
  /rubix/v1/fts/mint:
    post:
      consumes:
      - application/json
      description: Mints a named fungible token (FT) for a DID, backed by the requested
        number of RBT tokens.
      parameters:
      - description: Create FT
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/types.CreateFTReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Create FT
      tags:
      - FT
  /rubix/v1/nfts/{nft_id}/chain:
    get:
      description: This API will return the nft chain for a given nft token ID
      parameters:
      - description: NFT Token ID
        in: path
        name: nft_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get nft chain by token ID
      tags:
      - NFT
  /rubix/v1/nfts/{nft_id}/children:
    get:
      consumes:
      - application/json
      description: Returns NFTs whose parent_token_id matches the given parent NFT
        ID. Originator-only.
      parameters:
      - description: Parent NFT token ID
        in: path
        name: nft_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get child NFTs of a given parent NFT
      tags:
      - NFT
  /rubix/v1/nfts/{nft_id}/parent:
    get:
      consumes:
      - application/json
      description: Returns the parent NFT (id + value) of the named NFT, or null when
        there is no parent. Originator-only.
      parameters:
      - description: Child NFT token ID
        in: path
        name: nft_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get the parent NFT of a given child NFT
      tags:
      - NFT
  /rubix/v1/nfts/generate:
    post:
      consumes:
      - multipart/form-data
      description: This API will create new NFT
      parameters:
      - description: DID
        in: formData
        name: did
        required: true
        type: string
      - description: JSON file which contains information about the NFT
        in: formData
        name: metadata
        required: true
        type: file
      - description: File which is meant to be an NFT
        in: formData
        name: artifact
        required: true
        type: file
      produces:
      - multipart/form-data
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Create NFT
      tags:
      - NFT
  /rubix/v1/nfts/subscribe:
    get:
      consumes:
      - application/json
      description: This API endpoint allows subscribing to a NFT.
      parameters:
      - description: NFT token to subscribe to
        in: query
        name: nft
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Subscribe to NFT
      tags:
      - NFT
  /rubix/v1/node/add_peers:
    post:
      consumes:
      - application/json
      description: Manually registers a DID-to-PeerID mapping so this node can reach
        the peer.
      parameters:
      - description: Peer Details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.DIDPeerMapTemp'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Add Peer
      tags:
      - Peer
  /rubix/v1/node/peer_id:
    get:
      description: Returns the libp2p peer ID of this node.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get peer ID
      tags:
      - Peer
  /rubix/v1/node/ping:
    get:
      description: Pings the given peer by peerID to check reachability.
      parameters:
      - description: Peer ID of the node to ping (52-char alphanumeric, prefixed with
          12D3KooW)
        in: query
        name: peerID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Ping a peer
      tags:
      - Peer
  /rubix/v1/quorums:
    get:
      description: Returns the list of quorums configured on the node.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get all quorums
      tags:
      - Quorum
  /rubix/v1/quorums/add:
    post:
      consumes:
      - application/json
      description: Adds a quorum to the node's quorum list, identified by its DID.
      parameters:
      - description: Quorum to add
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.AddQuorumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Add quorum
      tags:
      - Quorum
  /rubix/v1/quorums/remove_all:
    get:
      description: Removes all quorums from the node's quorum list.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Remove all quorums
      tags:
      - Quorum
  /rubix/v1/quorums/setup:
    post:
      consumes:
      - application/json
      description: Sets up the quorum for the given DID using the supplied passwords.
      parameters:
      - description: Quorum setup request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.QuorumSetup'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Setup quorum
      tags:
      - Quorum
  /rubix/v1/quorums/status:
    get:
      description: Checks whether the quorum identified by the given DID is set up
        and available.
      parameters:
      - description: DID of the quorum (59-char alphanumeric, prefixed with bafybmi)
        in: query
        name: quorumAddress
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Check quorum status
      tags:
      - Quorum
  /rubix/v1/signature:
    post:
      consumes:
      - application/json
      description: This API is used to supply the password for the node along with
        the ID generated when Initiate RBT transfer is called.
      operationId: signature-response
      parameters:
      - description: Send input for requested signature
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/types.SignRespData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Signature Response
      tags:
      - Signature
  /rubix/v1/signature/arbitrary:
    post:
      consumes:
      - application/json
      description: Accepts a DID and message to request an arbitrary signature asynchronously.
      operationId: arbitrary-signature
      parameters:
      - description: Arbitrary Signature Request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.ArbitrarySignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Request Arbitrary Signature
      tags:
      - Signature
  /rubix/v1/signature/verify:
    get:
      consumes:
      - application/json
      description: Verifies a signature for a given DID and signed message.
      operationId: verify-arbitrary-signature
      parameters:
      - description: DID of the signer
        in: query
        name: signer_did
        required: true
        type: string
      - description: Signed message
        in: query
        name: signed_msg
        required: true
        type: string
      - description: Signature to verify
        in: query
        name: signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Verify Arbitrary Signature
      tags:
      - Signature
  /rubix/v1/smart_contracts:
    get:
      description: This API will return all smart contracts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get all smartcontracts
      tags:
      - Smart Contract
  /rubix/v1/smart_contracts/{contract_id}/chain:
    get:
      description: This API will return the smart contract chain for a given smart
        contract token ID
      parameters:
      - description: Smart Contract Token ID
        in: path
        name: contract_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get smart contract chain by token ID
      tags:
      - Smart Contract
  /rubix/v1/smart_contracts/generate:
    post:
      consumes:
      - multipart/form-data
      description: Generates a smart contract token for a DID from the uploaded binary
        and raw code files.
      parameters:
      - description: DID
        in: formData
        name: did
        required: true
        type: string
      - description: location of binary code hash
        in: formData
        name: binaryCodePath
        required: true
        type: file
      - description: location of raw code hash
        in: formData
        name: rawCodePath
        required: true
        type: file
      produces:
      - multipart/form-data
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Generate Smart Contract
      tags:
      - Smart Contract
  /rubix/v1/smart_contracts/register_callback:
    post:
      consumes:
      - application/json
      description: This API will register call back url for when updated come for
        smart contract token
      operationId: register-callback-url
      parameters:
      - description: Register call back URL
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.RegisterCallBackUrlReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Get Smart Contract Token Chain Data
      tags:
      - Smart Contract
  /rubix/v1/smart_contracts/subscribe:
    get:
      consumes:
      - application/json
      description: This API endpoint allows subscribing to a smart contract.
      parameters:
      - description: Smart contract token to subscribe to
        in: query
        name: smartContractToken
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Subscribe to Smart Contract
      tags:
      - Smart Contract
  /rubix/v1/sync:
    post:
      consumes:
      - application/json
      description: Rebuilds the local wallet's token state for a DID by pulling
      parameters:
      - description: DID of the wallet to recover
        in: body
        name: did
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Recover wallet state from a published fullnode
      tags:
      - Recovery
  /rubix/v1/sync-transaction-chain:
    post:
      consumes:
      - application/json
      description: Returns ordered transaction chains for the requested token IDs,
        optionally excluding specific transaction IDs
      operationId: syncTxChain
      parameters:
      - description: sync request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/server.syncTransactionChainRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Sync transaction chains for tokens
      tags:
      - Transactions
  /rubix/v1/tokens/generate_local_rbt:
    post:
      consumes:
      - application/json
      description: Generates local (test) RBT tokens for the given DID on a local
        network.
      parameters:
      - description: Local RBT generation request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.GenerateLocalRBTRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Generate local RBT
      tags:
      - Token
  /rubix/v1/tx:
    get:
      consumes:
      - application/json
      description: Returns all transactions stored on this node.
      operationId: getAllTx
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: List transactions
      tags:
      - Transactions
    post:
      consumes:
      - application/json
      description: Submits a transfer request (RBT, FT, NFT or smart contract) and
        runs it through quorum consensus. Returns a request ID that must be passed
        to the signature API (POST /rubix/v1/signature) to sign and complete the transaction.
      operationId: txInit
      parameters:
      - description: transaction
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.TransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BasicResponse'
      summary: Initiates a transaction
      tags:
      - Transactions
  /rubix/v1/tx/{did}/{token_type}:
    get:
      consumes:
      - application/json
      description: |-
        Returns transactions for the given DID, filtered by token type (rbt, nft, ft, smartContract).
        Optional query parameters narrow results further:
        - latest: return only the N most recent transactions sorted by epoch descending (e.g. latest=5)
        - start_date / end_date: filter by created_at date range, inclusive, format YYYY-MM-DD
        - start_epoch / end_epoch: filter by epoch range, inclusive integer values
      operationId: getTxnsByDID
      parameters:
      - description: DID
        in: path
        name: did
        required: true
        type: string
      - description: Token Type (rbt, nft, ft, smartContract)
        in: path
        name: token_type
        required: true
        type: string
      - description: Return only the N most recent transactions sorted by epoch descending
        in: query
        name: latest
        type: integer
      - description: Start date for created_at filter (YYYY-MM-DD, inclusive)
